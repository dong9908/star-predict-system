name: astra

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
      - --performance-schema=OFF
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: astra-server:local
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.docker
        required: false
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      YOLO_MODEL_PATH: /app/models/best.pt
      KNOWN_WCS_DIR: /app/known-wcs
      FRONT_ORIGINS: ${FRONT_ORIGINS:-http://localhost}
      PLATE_SOLVE_TIMEOUT_SECONDS: ${PLATE_SOLVE_TIMEOUT_SECONDS:-90}
      PLATE_SOLVE_SCALE_LOWER: ${PLATE_SOLVE_SCALE_LOWER:-5}
      PLATE_SOLVE_SCALE_UPPER: ${PLATE_SOLVE_SCALE_UPPER:-160}
      PLATE_SOLVE_DOWNSAMPLE: ${PLATE_SOLVE_DOWNSAMPLE:-4}
      PLATE_SOLVE_TWO_STAGE_RETRY: ${PLATE_SOLVE_TWO_STAGE_RETRY:-true}
      PLATE_SOLVE_SECOND_STAGE_TIMEOUT_SECONDS: ${PLATE_SOLVE_SECOND_STAGE_TIMEOUT_SECONDS:-75}
    volumes:
      - ./deploy/models:/app/models:ro
      - ./deploy/astrometry:/usr/share/astrometry:ro
      - ./deploy/wcs-cache:/app/known-wcs:ro
      - plate_cache:/app/Constellation/data/results/realtime_plate_solving
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    image: astra-front:local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mysql_data:
  plate_cache:
